  <script>
    (function () {
      /* file:// não carrega o app Vite — manda para o site publicado */
      if (location.protocol === "file:") {
        location.replace("https://infinityprojetos0-star.github.io/Eletrica/");
        return;
      }
      try {
        var t = localStorage.getItem("voltes-theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
